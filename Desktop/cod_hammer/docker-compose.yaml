services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET_KEY=+Z69/6ioV8reZH1ox//JmeRq3I0soi0f0va3SLfqq2Tj93UhsGTdZKW4hMT+wXL8
      - DB_URL=postgres://user:pass@db:5432/mydb
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    build: ./frontend
    networks:
      - app-network

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge